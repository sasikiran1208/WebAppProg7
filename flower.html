<script>
    let ids = [];

    for (let i = 0; i < 36; i++) {
        ids.push("img" + i);
    }

    let score = 0;
    let locationsVisited = 0;
    let lastLocation = 0;    
    let positions = [];

    for (let i = 0; i < 36; i++) {
        positions.push(i);
    }
    for (let i = positions.length - 1; i > 0; i--) {
        let randomIndex = Math.floor(Math.random() * (i + 1));

        let temp = positions[i];
        positions[i] = positions[randomIndex];
        positions[randomIndex] = temp;
    }

    let poisonLocation = positions[0];
    let roseLocation = positions[1];
    let lilyLocations = [positions[2], positions[3]];
    let daisyLocations = positions.slice(4, 9);


    let gameOver = false;
    let visitedPositions = [];


    
function check(position) {
    if (gameOver || visitedPositions.includes(position)) {
    return;
    }

visitedPositions.push(position);


    let image = document.getElementById(ids[position]);

    if (position === poisonLocation) {
        image.src = "images/poison-ivy.svg";
        score = score - 4;
        gameOver = true;
    }
    else if (position === roseLocation) {
        image.src = "images/rose.svg";
        score = score + 4;
    }
    else if (lilyLocations.includes(position)) {
        image.src = "images/lily.svg";
        score = score + 2;
    }
    else if (daisyLocations.includes(position)) {
        image.src = "images/daisy.svg";
        score = score + 1;
    }

    image.onclick = null;

    locationsVisited++;
    lastLocation = position;    
    
    if (!gameOver) {
        moveRose();

        if (visitedPositions.includes(roseLocation)) {
            gameOver = true;

            document.getElementById("help").innerHTML =
                "Game Over! The rose landed on you.";
        }
    }



    document.getElementById("locations").innerHTML =
        "Number of locations checked is " + locationsVisited;

    document.getElementById("score").innerHTML =
        "Score is " + score;

    if (position === poisonLocation) {
    document.getElementById("help").innerHTML =
        "Game Over! You found poison ivy.";
    }
}   
    
    function moveRose() {
        let row = Math.floor(roseLocation / 6);
        let col = roseLocation % 6;

        let moves = [];

        if (row > 0) moves.push(roseLocation - 6);
        if (row < 5) moves.push(roseLocation + 6);
        if (col > 0) moves.push(roseLocation - 1);
        if (col < 5) moves.push(roseLocation + 1);

        let randomIndex = Math.floor(Math.random() * moves.length);
        roseLocation = moves[randomIndex];
    }

    
function help() {
    let row = Math.floor(lastLocation / 6);
    let col = lastLocation % 6;
    let neighbors = [
        row * 6 + (col + 1) % 6,
        row * 6 + (col + 5) % 6,
        ((row + 1) % 6) * 6 + col,
        ((row + 5) % 6) * 6 + col
    ];

    let result = "warm";

    for (let i = 0; i < neighbors.length; i++) {
        if (daisyLocations.includes(neighbors[i])) {
            result = "cold";
        }
    }
    if (result !== "cold") {
        for (let r = row - 1; r <= row + 1; r++) {
            for (let c = col - 1; c <= col + 1; c++) {
                if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                    let position = r * 6 + c;

                    if (position === roseLocation) {
                        result = "hot";
                    }
                }
            }
        }
    }

    if (result === "warm") {
        for (let r = row - 1; r <= row + 1; r++) {
            for (let c = col - 1; c <= col + 1; c++) {
                if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                    let position = r * 6 + c;

                    if (position === poisonLocation) {
                        result = "watch out";
                    }
                }
            }
        }
    }

    document.getElementById("help").innerHTML = result;
}
</script>
