<!DOCTYPE html>
<html lang="en">
<head>
  <title>Reflex Timer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" 
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>  

  </head>

<body class="container mt-4">

    <h2>Sasi Kiran Kodali reflexes</h2>

    <div id="target">Your time</div>
    <div id="counter">Count</div>

    <br>

    <button class="btn btn-primary" onclick="beginTime()">
        Go
    </button>

    <button class="btn btn-danger" onclick="recordTime()">
        Halt
    </button>

    
<script>
    let haltTime = undefined;
    let startTime = undefined;
    let totalTime = 0;
    let running = false;
    let timers = [];

    function recordTime() {
        if (running) {
            haltTime = Date.now();
            console.log(haltTime);
        }
    }

    function beginTime() {
        for (let timer of timers) {
            clearTimeout(timer);
        }
        timers = [];

        haltTime = undefined;
        running = true;

        let startCount = Math.floor(Math.random() * 9) + 2;
        totalTime = startCount * 1000;
        startTime = Date.now();
        document.getElementById("target").innerHTML = "Your time";
        document.getElementById("counter").innerHTML = startCount;
        for (let i = 0; i <= startCount; i++) {
            let timer = setTimeout(function() {
                document.getElementById("counter").innerHTML = i;
            }, (startCount - i) * 1000);

            timers.push(timer);
        }
        let resultTimer = setTimeout(function() {
            running = false;

            if (haltTime === undefined) {
                document.getElementById("target").innerHTML =
                    "Not soon enough";
            }
            else {
                let targetTime = startTime + totalTime;
                let difference = targetTime - haltTime;

                document.getElementById("target").innerHTML =
                    "Time was " + difference + " milliseconds";
            }
        }, totalTime);

        timers.push(resultTimer);
    }
    </script>

</body>
</html>
